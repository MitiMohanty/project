# Server
server.port=9090

# Template default
template.default-language=EN

# Database (docker-compose service name)
spring.datasource.url=jdbc:mysql://template-db:3306/templatedb
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka (docker-compose service name)
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

# Management
management.endpoints.web.exposure.include=*

# Optional: any Docker-specific tracing / Zipkin (if needed)
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
