server.port=9777
management.endpoints.web.exposure.include=*
management.endpoint.gateway.access=read-only
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
spring.cloud.gateway.server.webflux.routes[0].id=flight-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://FLIGHT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/flight/**
spring.cloud.gateway.server.webflux.routes[1].id=passenger-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:9098
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/passenger/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=CircuitBreaker=name=passengerService,fallbackUri=forward:/fallback/passenger
spring.cloud.gateway.server.webflux.routes[2].id=event-processing-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://EVENT-PROCESSING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/events/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=CircuitBreaker=name=eventProcessor,fallbackUri=forward:/fallback/events
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
#spring.cloud.gateway.server.webflux.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/notify/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=CircuitBreaker=name=emailService,fallbackUri=forward:/fallback/notification

