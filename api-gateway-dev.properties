server.port=9777
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
spring.cloud.gateway.routes[0].id=flight-service
spring.cloud.gateway.routes[0].uri=lb://FLIGHT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/flight/**
spring.cloud.gateway.routes[1].id=passenger-service
spring.cloud.gateway.routes[1].uri=lb://PASSENGER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/passenger/**
spring.cloud.gateway.routes[2].id=event-processing-service
spring.cloud.gateway.routes[2].uri=lb://EVENT-PROCESSING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/events/**
spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/notify/**
